name: Test Docker Image

on: push

jobs:
  build-and-run:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t foresight-evaluation -f Dockerfile .

      - name: Run experiments
        run: |
          mkdir -p results

          docker run --rm \
            --mount type=bind,src=./results,dst=/results \
            -e BENCH_SECONDS=5 \
            -e FORESIGHT_THREAD_COUNTS="1 2" \
            foresight-evaluation \
            foresight-comparison
          cat results/foresight-comparison/ratios.csv

          docker run --rm \
            --mount type=bind,src=./results,dst=/results \
            -e BENCH_SECONDS=5 \
            foresight-evaluation \
            incremental-eqsat
          cat results/incremental-eqsat/sat-times.csv
